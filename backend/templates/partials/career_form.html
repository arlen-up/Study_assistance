{# 커리어 나비게이터 입력 영역 (LMS 연결 직후 OOB로 다시 그려짐) #}
<div id="career-form-area"{% if oob_materials %} hx-swap-oob="true"{% endif %}>
  {% if lms_status and lms_status.linked %}
  <form class="row" hx-post="/ui/career" hx-target="#career-result" hx-indicator="#career-loading"
        hx-disabled-elt="find button">
    <select name="job_role" class="select" aria-label="관심 직무">
      <option value="">관심 직무를 선택하세요</option>
      {% for t in career_tracks or [] %}
      <option value="{{ t.job_role }}"{% if t.job_role == target_job %} selected{% endif %}>{{ t.title }}</option>
      {% endfor %}
    </select>
    <button type="submit" class="btn primary">분석하기</button>
  </form>
  <p id="career-loading" class="htmx-indicator muted small"><span class="spinner"></span> 성적표와 졸업 요건을 분석하고 AI 조언을 만드는 중…</p>
  {% else %}
  <div class="alert info">위 <strong>‘🎓 내 학점 알아보기’</strong>에서 학교 계정을 먼저 연결해 주세요. 성적표를 바탕으로 분석해요.</div>
  {% endif %}
</div>
