{% import "partials/_macros.html" as m %}
{# 마인드맵: 위치는 파이썬(study_tools_service.layout_mindmap)이 계산, 여기서는 그리기만 한다 #}
<div class="stack">
  <div class="tags"><strong>{{ mindmap.document_title }}</strong></div>
  <div class="mindmap-wrap">
    <svg class="mindmap" viewBox="0 0 {{ mindmap.width }} {{ mindmap.height }}" width="{{ mindmap.width }}"
         height="{{ mindmap.height }}" role="img" aria-label="{{ mindmap.root }} 마인드맵">
      {% for e in mindmap.edges %}<path d="{{ e.path }}" class="mm-edge lv{{ e.level }}"></path>{% endfor %}
      {% for n in mindmap.nodes %}
      <g class="mm-node lv{{ n.level }}" transform="translate({{ n.x }},{{ n.y }})" tabindex="0" role="button"
         data-ask="‘{{ n.label }}’에 대해 교안 내용을 바탕으로 쉽게 설명해줘">
        <title>{{ n.label }} — 눌러서 챗봇에 물어보기</title>
        <rect width="{{ n.width }}" height="{{ n.height }}" rx="{{ 18 if n.level == 0 else 10 }}"></rect>
        <text x="{{ n.width / 2 }}" y="{{ n.height / 2 }}" text-anchor="middle" dominant-baseline="central">{{ n.label }}</text>
      </g>
      {% endfor %}
    </svg>
  </div>
  <p class="muted xsmall">개념을 누르면 💬 챗봇 탭으로 이동해 질문이 입력돼요.</p>
  {{ m.tool_badges(mindmap.tool_calls) }}
</div>
