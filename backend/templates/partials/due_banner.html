{# 에빙하우스 '앱 내 알림' 배너 #}
<div id="due-banner"{% if oob %} hx-swap-oob="true"{% endif %}>
  {% set due_count = dashboard.reviews.due | length %}
  {% if due_count > 0 %}
  <div class="alert info" role="status">
    <strong>🔔 오늘 복습할 교안이 {{ due_count }}개 있어요.</strong>
    지금 복습하면 기억이 훨씬 오래가요. 아래 ‘복습 알림’에서 바로 퀴즈·카드를 풀 수 있어요.
  </div>
  {% endif %}
</div>
