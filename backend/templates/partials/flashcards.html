{% import "partials/_macros.html" as m %}
{# 카드 뒤집기는 체크박스 + CSS 만으로 동작 (JS 없음) #}
<form class="stack" hx-post="/ui/flashcards/submit" hx-target="#flashcards-area"
      hx-indicator="#flashcards-submit-loading" hx-disabled-elt="find button[type=submit]">
  <div class="tags"><strong>{{ deck.document_title }}</strong><span class="badge secondary">{{ deck.cards | length }}장</span></div>
  <input type="hidden" name="document_id" value="{{ deck.document_id }}">
  <input type="hidden" name="card_count" value="{{ deck.cards | length }}">
  <input type="hidden" name="started_at" value="{{ started_at }}">

  <div class="flash-grid">
    {% for card in deck.cards %}
    <div class="flashcard">
      <input type="checkbox" id="flip-{{ card.index }}" class="flip-toggle">
      <label for="flip-{{ card.index }}" class="flash-inner" aria-label="{{ card.index + 1 }}번 카드 뒤집기">
        <span class="flash-face front">
          <span class="flash-no">{{ card.index + 1 }}</span>
          <span class="flash-text">{{ card.front }}</span>
          {% if card.hint %}<span class="flash-hint">💡 {{ card.hint }}</span>{% endif %}
          <span class="flash-tip">눌러서 뒤집기</span>
        </span>
        <span class="flash-face back">
          <span class="flash-text">{{ card.back }}</span>
          {% if card.source %}<span class="flash-src">📄 {{ card.source.document_title }}{% if card.source.page_number %} p.{{ card.source.page_number }}{% endif %}</span>{% endif %}
        </span>
      </label>
      <div class="flash-rate" role="radiogroup" aria-label="{{ card.index + 1 }}번 카드 자가 평가">
        <label class="option"><input type="radio" name="card_{{ card.index }}" value="know" required><span>😀 알아요</span></label>
        <label class="option"><input type="radio" name="card_{{ card.index }}" value="again"><span>🤔 다시 볼래요</span></label>
      </div>
      <input type="hidden" name="front_{{ card.index }}" value="{{ card.front }}">
    </div>
    {% endfor %}
  </div>

  <button type="submit" class="btn primary lg">학습 완료하기</button>
  <p id="flashcards-submit-loading" class="htmx-indicator muted small"><span class="spinner"></span> 기록하는 중…</p>
  {{ m.tool_badges(deck.tool_calls) }}
</form>
